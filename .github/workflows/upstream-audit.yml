name: Upstream and Android reference audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/upstream-audit.yml"
      - "scripts/**"
      - "phone-port/**"
      - "docs/**"
      - "README.md"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  phone-backend-tests:
    name: Test phone input and integration patch
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out porting workspace
        uses: actions/checkout@v4

      - name: Compile and test multi-touch controls
        run: bash phone-port/tests/run_tests.sh

      - name: Validate patcher syntax
        run: python3 -m py_compile phone-port/tools/apply_phone_port.py phone-port/tests/test_apply_phone_port.py

      - name: Test phone integration patch on isolated fixtures
        run: python3 phone-port/tests/test_apply_phone_port.py

  audit:
    name: Inspect engine portability and Android phone gaps
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out porting workspace
        uses: actions/checkout@v4

      - name: Check repository health and status consistency
        run: bash scripts/check_repository_health.sh .

      - name: Check out desktop upstream source
        uses: actions/checkout@v4
        with:
          repository: argos-research/speed-dreams
          ref: master
          path: upstream
          fetch-depth: 1

      - name: Check out Android VR reference
        uses: actions/checkout@v4
        with:
          repository: SgtBilko76/SpeedDreams-VR
          ref: v0.10.0-beta
          path: android-reference
          fetch-depth: 1

      - name: Audit classic upstream portability
        run: bash scripts/audit_upstream.sh upstream reports/android-portability-audit.md

      - name: Audit Android reference for phone compatibility
        run: bash scripts/audit_android_reference.sh android-reference reports/android-reference-audit.md

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: speed-dreams-android-port-audits
          path: |
            reports/android-portability-audit.md
            reports/android-reference-audit.md
          if-no-files-found: error
          retention-days: 30
