name: Build Speed Dreams phone APK (Redmi A1+ universal ARM)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone-port/**"
      - ".github/workflows/android-phone-apk.yml"

permissions:
  contents: write

jobs:
  build-phone-apk:
    name: Bootstrap sources, patch phone backend, build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out porting workspace
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install pinned Android NDK and CMake
        run: sdkmanager --install "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Run phone-port regression tests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s phone-port/tests -p 'test_*.py' -v
          bash phone-port/tests/run_tests.sh

      - name: Bootstrap pinned Speed Dreams sources and native dependencies
        id: sources
        run: |
          set -o pipefail
          bash phone-port/tools/bootstrap_speed_dreams_android_build.sh "$RUNNER_TEMP/sd-port-build" \
            2>&1 | tee "$RUNNER_TEMP/android-source-bootstrap.log"

      - name: Stage upstream game data and phone config
        run: |
          set -euo pipefail
          VR="$RUNNER_TEMP/sd-port-build/SpeedDreams-VR"
          ENGINE="$RUNNER_TEMP/sd-port-build/speed-dreams-code"
          export SD_ROOT="$ENGINE"
          python3 "$VR/tools/stage_data.py" --clean
          DATA="$VR/stage/SpeedDreamsVR/data"
          # GIMP editor source files are not runtime game assets; exclude them from the bundled data.
          find "$DATA" -type f \( -name '*.xcf' -o -name '*.xcf.bz2' \) -print -delete
          echo "Staged runtime data size:"
          du -sh "$DATA"
          test -s "$DATA/config/raceman.xml" || \
            find "$VR/stage/SpeedDreamsVR" -maxdepth 3 -type f | head -30

      - name: Install stable phone development signing key
        run: |
          set -euo pipefail
          KEY_B64="phone-port/signing/speed-dreams-phone-debug.keystore.b64"
          test -s "$KEY_B64"
          mkdir -p "$HOME/.android"
          base64 --decode "$KEY_B64" > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey >/dev/null
          echo "Stable development signing key installed."

      - name: Build release APK with game data bundled
        run: |
          set -euo pipefail
          VR="$RUNNER_TEMP/sd-port-build/SpeedDreams-VR"
          chmod +x "$VR/android/gradlew"
          python3 "$VR/tools/make_release.py"
          APK="$VR/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/Speed-Dreams-Mobile-Redmi-Universal.apk
          file dist/Speed-Dreams-Mobile-Redmi-Universal.apk
          APK_SIZE="$(stat -c %s dist/Speed-Dreams-Mobile-Redmi-Universal.apk)"
          echo "Final APK size: $APK_SIZE bytes"
          # Fail CI if the APK grows back beyond a reliable mobile-download size.
          test "$APK_SIZE" -lt 160000000

      - name: Enforce modern APK signature with apksigner
        run: |
          set -euo pipefail
          APK="dist/Speed-Dreams-Mobile-Redmi-Universal.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BT_DIR="$SDK_ROOT/build-tools/35.0.0"
          test -s "$HOME/.android/debug.keystore"
          "$BT_DIR/apksigner" version
          # Re-sign the final deliverable explicitly before any final verification.
          # This app requires API 29+, where APK Signature Scheme v2 is supported;
          # v1 is legacy compatibility only and is not required for Redmi A1+ Android 12.
          "$BT_DIR/apksigner" sign --verbose \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$RUNNER_TEMP/Speed-Dreams-Mobile-Redmi-Universal-signed.apk" \
            "$APK"
          # Require the modern v2 signature; v1 is not an install requirement for API 29+.
          # Override the verification floor to API 21 to verify the actual v1
          # JAR signature as well; the APK manifest minSdk remains 29.
          "$BT_DIR/apksigner" verify --verbose --min-sdk-version 21 \
            "$RUNNER_TEMP/Speed-Dreams-Mobile-Redmi-Universal-signed.apk" \
            | tee "$RUNNER_TEMP/preflight-apksigner-verify.txt"
          grep -Fq "Verified using v1 scheme (JAR signing): true" "$RUNNER_TEMP/preflight-apksigner-verify.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/preflight-apksigner-verify.txt"
          mv "$RUNNER_TEMP/Speed-Dreams-Mobile-Redmi-Universal-signed.apk" "$APK"

      - name: Verify APK structure, manifest, signatures, and native ABIs
        run: |
          set -euo pipefail
          APK="dist/Speed-Dreams-Mobile-Redmi-Universal.apk"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          BT_DIR="$SDK_ROOT/build-tools/35.0.0"
          test -x "$BT_DIR/apksigner"
          test -x "$BT_DIR/aapt"
          test -x "$BT_DIR/zipalign"

          # Structural checks catch truncated APKs and bad bundled game archives.
          unzip -t "$APK" > "$RUNNER_TEMP/apk-zip-test.txt"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-list.txt"
          grep -q "lib/armeabi-v7a/libsdvr.so" "$RUNNER_TEMP/apk-list.txt"
          grep -q "lib/arm64-v8a/libsdvr.so" "$RUNNER_TEMP/apk-list.txt"
          grep -q "lib/x86_64/libsdvr.so" "$RUNNER_TEMP/apk-list.txt"
          grep -q "assets/gamedata.zip" "$RUNNER_TEMP/apk-list.txt"
          unzip -p "$APK" assets/gamedata.zip > "$RUNNER_TEMP/gamedata.zip"
          unzip -t "$RUNNER_TEMP/gamedata.zip" > "$RUNNER_TEMP/gamedata-zip-test.txt"

          # Validate actual package metadata instead of merely finding a manifest.
          "$BT_DIR/aapt" dump badging "$APK" > "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "package: name='com.speeddreams.mobile' versionCode='9' versionName='0.10.1-phone3'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "sdkVersion:'29'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "targetSdkVersion:'32'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "native-code:" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "'armeabi-v7a'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "'x86_64'" "$RUNNER_TEMP/apk-badging.txt"

          # Verify the app for its declared minSdk (29): v2 must be accepted there.
          "$BT_DIR/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-verify.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner-verify.txt"
          # Separately check the APK's v1 JAR signature on an API level where v1
          # is applicable. This does not lower the APK manifest's minSdkVersion.
          "$BT_DIR/apksigner" verify --verbose --min-sdk-version 21 "$APK" | tee "$RUNNER_TEMP/apksigner-legacy-verify.txt"
          grep -Fq "Verified using v1 scheme (JAR signing): true" "$RUNNER_TEMP/apksigner-legacy-verify.txt"
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" "$RUNNER_TEMP/apksigner-legacy-verify.txt"
          "$BT_DIR/zipalign" -c -v 4 "$APK" > "$RUNNER_TEMP/zipalign-check.txt"

          unzip -p "$APK" AndroidManifest.xml > "$RUNNER_TEMP/AndroidManifest.bin"
          if strings "$RUNNER_TEMP/AndroidManifest.bin" | grep -qi "org.khronos.openxr.permission.OPENXR_SYSTEM"; then
            echo "Unexpected OpenXR permission found in binary manifest" >&2
            exit 1
          fi
          sha256sum "$APK" | tee dist/SHA256SUMS.txt

      - name: Stop build daemons before starting the Android emulator
        if: always()
        run: |
          # Native compilation leaves Gradle/JVM processes resident. Release their
          # memory before booting the emulator to avoid Android framework services
          # dying during first boot on the hosted runner.
          jps -l | awk '/GradleDaemon|KotlinCompileDaemon/ {print $1}' | xargs -r kill -9 || true
          sync

      - name: Runtime smoke test on Android 11 x86_64 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 2048M
          heap-size: 384M
          disk-size: 4G
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -wipe-data
          disable-animations: true
          disable-linux-hw-accel: true
          script: |
            set -euo pipefail
            APK="dist/Speed-Dreams-Mobile-Redmi-Universal.apk"
            mkdir -p dist
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop com.speeddreams.mobile || true
            adb shell am start -n com.speeddreams.mobile/com.speeddreamsvr.SDVRActivity
            deadline=$((SECONDS + 180))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if adb logcat -d -s SpeedDreamsPhone:I | grep -Fq "BOOT stage=sdmain-enter"; then
                break
              fi
              if [ "$SECONDS" -gt 15 ] && ! adb shell pidof com.speeddreams.mobile >/dev/null 2>&1; then
                echo "Speed Dreams process exited before engine startup." >&2
                break
              fi
              sleep 2
            done
            adb logcat -d -v threadtime > dist/android-emulator-logcat.txt
            adb shell screencap -p /sdcard/sd-phone-runtime.png
            adb pull /sdcard/sd-phone-runtime.png dist/android-emulator-screen.png
            grep -Fq "DIAG stage=jni-onCreate-return" dist/android-emulator-logcat.txt
            grep -Fq "BOOT stage=gl4es-initialized" dist/android-emulator-logcat.txt
            grep -Fq "BOOT stage=sdmain-enter" dist/android-emulator-logcat.txt
            if grep -Eiq "FATAL native signal|Fatal signal [0-9]+|SIGSEGV|SIGABRT" dist/android-emulator-logcat.txt; then
              echo "Native crash detected by Android emulator runtime test." >&2
              exit 1
            fi
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
            from PIL import Image
            image = Image.open("dist/android-emulator-screen.png").convert("RGB")
            image.thumbnail((120, 270))
            pixels = list(image.getdata())
            non_dark = sum(1 for r, g, b in pixels if max(r, g, b) > 24) / max(1, len(pixels))
            distinct = len(set(pixels))
            with open("dist/android-emulator-analysis.txt", "w", encoding="utf-8") as f:
                f.write(f"screen_size={image.size} non_dark_ratio={non_dark:.4f} distinct_colors={distinct}\\n")
            print(f"Runtime screenshot: non-dark ratio={non_dark:.4f}, distinct colors={distinct}")
            if non_dark < 0.015 or distinct < 80:
                raise SystemExit("Screenshot is effectively black; renderer smoke test failed.")
            PY

      - name: Publish APK as a direct Chrome download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="redmi-a1plus-armv7"
          APK="dist/Speed-Dreams-Mobile-Redmi-Universal.apk"
          SUMS="dist/SHA256SUMS.txt"
          TITLE="Speed Dreams Mobile — Redmi A1+ (signed universal ARM)"
          NOTES="Experimental flat-screen phone APK, package com.speeddreams.mobile, version 0.10.1-phone3. Uses app-specific writable storage instead of requiring MANAGE_EXTERNAL_STORAGE. Includes arm64-v8a, armeabi-v7a and x86_64 native libraries and a verified v2 APK signature. CI includes an Android 12 x86_64 emulator launch/render smoke test; Redmi A1+ ARM32 runtime still requires direct-device confirmation."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUMS" --clobber
            gh release delete-asset "$TAG" "Speed-Dreams-Mobile-Redmi-ARMv7.apk" --yes || true
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" "$SUMS" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Upload phone APK and source/build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-dreams-mobile-redmi-universal-apk
          path: |
            dist/Speed-Dreams-Mobile-Redmi-Universal.apk
            dist/SHA256SUMS.txt
            ${{ runner.temp }}/android-source-bootstrap.log
            ${{ runner.temp }}/sd-port-build/android-source-lock.txt
            ${{ runner.temp }}/sd-port-build/engine-submodules.txt
            dist/android-emulator-logcat.txt
            dist/android-emulator-screen.png
            dist/android-emulator-analysis.txt
          if-no-files-found: warn
          retention-days: 14
