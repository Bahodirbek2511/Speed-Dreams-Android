name: Build Speed Dreams phone APK (Redmi A1+ ARMv7)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "phone-port/**"
      - ".github/workflows/android-phone-apk.yml"

permissions:
  contents: write

jobs:
  build-phone-apk:
    name: Bootstrap sources, patch phone backend, build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out porting workspace
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install pinned Android NDK and CMake
        run: sdkmanager --install "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Bootstrap pinned Speed Dreams sources and native dependencies
        id: sources
        run: |
          set -o pipefail
          bash phone-port/tools/bootstrap_speed_dreams_android_build.sh "$RUNNER_TEMP/sd-port-build" \
            2>&1 | tee "$RUNNER_TEMP/android-source-bootstrap.log"

      - name: Stage upstream game data and phone config
        run: |
          set -euo pipefail
          VR="$RUNNER_TEMP/sd-port-build/SpeedDreams-VR"
          ENGINE="$RUNNER_TEMP/sd-port-build/speed-dreams-code"
          export SD_ROOT="$ENGINE"
          python3 "$VR/tools/stage_data.py" --clean
          test -s "$VR/stage/SpeedDreamsVR/data/config/raceman.xml" || \
            find "$VR/stage/SpeedDreamsVR" -maxdepth 3 -type f | head -30

      - name: Create CI debug signing keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [[ ! -s "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA -keysize 2048 -validity 10000
          fi
          test -s "$HOME/.android/debug.keystore"

      - name: Build release APK with game data bundled
        run: |
          set -euo pipefail
          VR="$RUNNER_TEMP/sd-port-build/SpeedDreams-VR"
          chmod +x "$VR/android/gradlew"
          python3 "$VR/tools/make_release.py"
          APK="$VR/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/Speed-Dreams-Mobile-Redmi-ARMv7.apk
          file dist/Speed-Dreams-Mobile-Redmi-ARMv7.apk

      - name: Verify package ABI, manifest, and native libraries
        run: |
          set -euo pipefail
          APK="dist/Speed-Dreams-Mobile-Redmi-ARMv7.apk"
          unzip -l "$APK" > "$RUNNER_TEMP/apk-list.txt"
          grep -q "lib/armeabi-v7a/libsdvr.so" "$RUNNER_TEMP/apk-list.txt"
          grep -q "assets/gamedata.zip" "$RUNNER_TEMP/apk-list.txt"
          unzip -p "$APK" AndroidManifest.xml > "$RUNNER_TEMP/AndroidManifest.bin"
          if strings "$RUNNER_TEMP/AndroidManifest.bin" | grep -qi "org.khronos.openxr.permission.OPENXR_SYSTEM"; then
            echo "Unexpected OpenXR permission found in binary manifest" >&2
            exit 1
          fi
          unzip -l "$APK" | grep -E 'lib/armeabi-v7a/|assets/gamedata.zip' | head -80
          sha256sum "$APK" | tee dist/SHA256SUMS.txt

      - name: Publish APK as a direct Chrome download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="redmi-a1plus-armv7"
          APK="dist/Speed-Dreams-Mobile-Redmi-ARMv7.apk"
          SUMS="dist/SHA256SUMS.txt"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$SUMS" --clobber
          else
            gh release create "$TAG" "$APK" "$SUMS" \
              --title "Speed Dreams Android — Redmi A1+ (ARMv7)" \
              --notes "Build for 32-bit ARM Android devices such as Redmi A1+. APK was built by GitHub Actions; device-level runtime testing is not yet confirmed."
          fi

      - name: Upload phone APK and source/build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-dreams-mobile-redmi-armv7-apk
          path: |
            dist/Speed-Dreams-Mobile-Redmi-ARMv7.apk
            dist/SHA256SUMS.txt
            ${{ runner.temp }}/android-source-bootstrap.log
            ${{ runner.temp }}/sd-port-build/android-source-lock.txt
            ${{ runner.temp }}/sd-port-build/engine-submodules.txt
          if-no-files-found: warn
          retention-days: 14
